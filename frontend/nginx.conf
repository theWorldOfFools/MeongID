server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API satu origin (penting untuk tunnel HTTPS/ngrok dari HP):
  # browser cukup panggil origin yang sama + /api/..., tanpa mixed-content.
  location /api/ {
    proxy_pass http://backend:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Foto hewan & galeri.
  location /uploads/ {
    proxy_pass http://backend:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Manifest PWA (nginx belum memetakan .webmanifest di mime.types).
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # Service worker: jangan di-cache agar update langsung terpakai.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
